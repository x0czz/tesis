name: Quarto Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # R es necesario para ejecutar los bloques {r} (p. ej. 04-resultados.qmd)
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::dplyr
            any::tidyr
            any::ggplot2

      # Solo HTML: el PDF necesita LaTeX/xelatex y es la causa típica de fallos en CI
      # _freeze/ del repo está desactualizado: dice que los gráficos existen
      # pero sus PNG no están guardados, así que se borra y R vuelve a ejecutar todo.
      - name: Render Quarto project (HTML)
        run: |
          rm -rf _freeze
          quarto render --to html

      # Publica la carpeta docs/ RECIÉN RENDERIZADA (no la versión del commit)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
