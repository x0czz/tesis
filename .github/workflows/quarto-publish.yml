
name: Quarto Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Use locally rendered presentation
        run: cp presentacion_tesis.html docs/index.html
      - name: Publish pre-rendered docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git subtree split --prefix docs -b gh-pages-build
          git push --force origin gh-pages-build:gh-pages
